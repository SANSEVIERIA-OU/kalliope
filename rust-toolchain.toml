# The Rust that builds, checks and releases Kalliope, everywhere: CI on Linux, Windows and macOS,
# release builds and local builds (rustup installs it on first use). Keep it at the latest stable
# release (https://static.rust-lang.org/dist/channel-rust-stable.toml), together with
# `rust-version` in Cargo.toml.
[toolchain]
channel = "1.100.0"
components = ["clippy", "rustfmt"]
profile = "minimal"
