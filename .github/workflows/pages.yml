# SPDX-License-Identifier: LicenseRef-SANSEVIERIA-1.1
# Publishes the website (website/, with design-system/) on GitHub Pages:
# https://sansevieria-ou.github.io/kalliope/
# tools/site.py fills in the release to download, so the site is rebuilt whenever the pages or the
# design system change and after every release. It builds only the languages whose website/lingue/<xx>.po
# is complete and checked, and says in this log which languages it left out and why (docs/translating.md).
name: Website

on:
  push:
    branches: [main]
    paths: ["website/**", "design-system/**", "tools/site.py", "tools/marchio.py", "tools/marchio_raster.py", "tools/i18n/**", "tools/data/**", ".github/workflows/pages.yml"]
  # Releases edited, published or deleted by hand on GitHub. A release made by the Release workflow sends no
  # release event (GitHub starts no workflow from what a run's own token does): that workflow starts this
  # one by hand once the release is out (workflow_dispatch, the exception GitHub makes).
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time. A deployment already running is never cancelled half-way; a newer run waits and
# replaces any run still queued, so the site always ends at the newest state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # A push that brings a new version (tools/version.py due) does not deploy: its pages already speak of the
  # new version, whose packages are not out yet. The Release workflow publishes them, then starts this
  # workflow, and the site changes in one go. If that release fails, the site stays as it was.
  due:
    name: Is a release on its way
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      release: ${{ steps.due.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - id: due
        run: |
          # shellcheck disable=SC2046 # one tag per word
          python3 tools/version.py due $(git ls-remote --tags --refs origin | cut -f2) | tee -a "$GITHUB_OUTPUT"

  # Building and deploying are two jobs. Deploying in the job that had just uploaded the site failed on
  # 20 November 2026: deploy-pages asked for the artifact 0.3 s after it was finalized and GitHub listed none
  # yet («No artifacts named "github-pages" were found»), and re-running that run then found two. The
  # deploy job starts only after the build job has finished, as in GitHub's own Pages workflows.
  build:
    needs: due
    if: >-
      !cancelled() &&
      (needs.due.result == 'skipped' || (needs.due.result == 'success' && needs.due.outputs.release != 'true'))
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - name: Build the site for the current release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I tools/site.py --out _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
