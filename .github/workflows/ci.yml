# Checks every change. Branches and pull requests: Linux only. main and runs started by hand:
# also Windows and macOS, which are slower and whose runners are scarcer (see docs/releasing.md).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the run it makes obsolete.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  linux:
    name: Linux
    # A pull request from a branch of this repository was already checked when it was pushed.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    # The newest Ubuntu; releases are built on the oldest one Kalliope supports (release.yml).
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Versions agree
        run: python3 tools/version.py check
      # Xvfb, xdotool and ImageMagick open and photograph the window; PyGObject serves the stub settings portal (tools/portale_finto.py);
      # fontTools and brotli derive the window's TTF faces from the woff2 files of the design system (tools/caratteri_ttf.py).
      - name: Tools to open, photograph and test the window
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends xvfb xdotool imagemagick dbus python3-gi gir1.2-glib-2.0 python3-fonttools python3-brotli
          # What the deb requires for the window, and nothing that would bring it by chance (tools/test_packaging.py checks the list).
          sudo apt-get install -y -q --no-install-recommends libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 libx11-6 libx11-xcb1 libxcb1 libxcursor1 libxi6
      - name: Website translations, mirrored style sheets, the mark, the window's values and typefaces
        run: |
          python3 -I tools/translations.py extract --check
          python3 -I tools/translations.py check
          python3 -I tools/css_logico.py
          python3 -I tools/marchio.py --check
          python3 -I tools/slint_valori.py
          python3 -I tools/caratteri_ttf.py --check
          python3 -I -m unittest discover -s tools -p 'test_*.py'
      - name: Format
        run: cargo fmt --all --check
      - name: Libraries the app links at build time
        run: pkg-config --exists fontconfig || sudo apt-get install -y -q --no-install-recommends libfontconfig-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Cache ONNX Runtime and the models
        uses: actions/cache@v6
        with:
          path: .ci-assets
          key: assets-${{ runner.os }}-${{ hashFiles('tools/assets.json', 'tools/fetch_assets.py') }}
      # From the assets release of this repository, pinned in tools/assets.json (docs/releasing.md).
      - name: ONNX Runtime, Klein and Pocket TTS
        run: |
          python3 tools/fetch_assets.py onnxruntime .ci-assets >> "$GITHUB_ENV"
          python3 tools/fetch_assets.py model .ci-assets >> "$GITHUB_ENV"
          python3 tools/fetch_assets.py pocket .ci-assets >> "$GITHUB_ENV"
      # With KALLIOPE_MODEL_DIR and KALLIOPE_POCKET_DIR set, the tests of both voices run for real.
      - name: Tests, with the models
        run: cargo test --workspace --locked
      - name: kalliope-cli says a sentence
        run: |
          cargo run -q -p kalliope-cli --locked -- say -o say.wav "Buongiorno a tutti, scusate il ritardo."
          python3 - say.wav <<'EOF'
          import sys, wave
          with wave.open(sys.argv[1]) as w:
              seconds = w.getnframes() / w.getframerate()
          print(f"{seconds:.2f} s of speech")
          sys.exit(0 if 1.5 < seconds < 6 else "expected 1.5 to 6 seconds")
          EOF
      # One Slint window on every desktop: no Qt, no GTK and no Python in the program, and the packages ask for no more than it loads.
      - name: The program links and loads what the packages declare
        run: |
          cargo build --locked --workspace --bins
          ldd target/debug/kalliope
          if ldd target/debug/kalliope | grep -Ei 'qt|python|gtk|adwaita|gobject'; then echo "the program links a toolkit it must not need" >&2; exit 1; fi
          KALLIOPE_BINARY=target/debug/kalliope python3 -I -m unittest discover -s tools -p 'test_packaging.py' -v
      # The window opens under Xvfb with no GPU, and follows the system appearance that the stub portal announces; with no portal
      # at all it still opens (light, like every Slint widget).
      - name: Open the window on Linux, in the dark and light system appearance and with no settings portal
        run: |
          for scheme in dark light; do
            xvfb-run -a -s "-screen 0 1280x900x24" dbus-run-session -- python3 -I tools/portale_finto.py $scheme -- python3 tools/check_desktop.py desktop-window-$scheme.png
          done
          xvfb-run -a -s "-screen 0 1280x900x24" dbus-run-session -- python3 tools/check_desktop.py desktop-window.png
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-window-linux
          path: desktop-window*.png
          if-no-files-found: error
          retention-days: 7

  windows-and-macos:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    # Only once Linux passes: a change that fails there does not wait for these slower runners.
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Cache ONNX Runtime and the models
        uses: actions/cache@v6
        with:
          path: .ci-assets
          key: assets-${{ runner.os }}-${{ hashFiles('tools/assets.json', 'tools/fetch_assets.py') }}
      - name: ONNX Runtime, Klein and Pocket TTS
        run: |
          python=$([ "$RUNNER_OS" = Windows ] && echo python || echo python3)
          $python tools/fetch_assets.py onnxruntime .ci-assets >> "$GITHUB_ENV"
          $python tools/fetch_assets.py model .ci-assets >> "$GITHUB_ENV"
          $python tools/fetch_assets.py pocket .ci-assets >> "$GITHUB_ENV"
      # Not the examples: crates/voice/examples/measure.rs measures with Linux-only calls.
      - name: Tests, with the models
        run: cargo test --workspace --lib --bins --tests --locked
      - name: Build the desktop application and CLI
        run: cargo build --locked --workspace --bins
      - name: Run both programs and open a native desktop window
        run: |
          python=$([ "$RUNNER_OS" = Windows ] && echo python || echo python3)
          $python tools/check_desktop.py
      # The theme setting is scoped to the disposable hosted runner's account.
      - name: Open the desktop application with the system dark appearance
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            reg.exe add 'HKCU\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize' //v AppsUseLightTheme //t REG_DWORD //d 0 //f
            python=python
          else
            osascript -e 'with timeout of 15 seconds' \
              -e 'tell application "System Events" to set dark mode of appearance preferences to true' \
              -e 'end timeout'
            test "$(osascript -e 'tell application "System Events" to get dark mode of appearance preferences')" = true
            python=python3
          fi
          $python tools/check_desktop.py desktop-window-dark.png
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-window-${{ matrix.os }}
          path: desktop-window*.png
          if-no-files-found: error
          retention-days: 7
