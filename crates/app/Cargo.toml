[package]
name = "kalliope-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Type, and be heard: the Kalliope app"

[[bin]]
name = "kalliope"
path = "src/main.rs"

[dependencies]
kalliope-text.workspace = true
kalliope-phonemes.workspace = true
kalliope-voice.workspace = true
kalliope-mic.workspace = true
kalliope-sample.workspace = true
kalliope-i18n.workspace = true
# One window through winit on every platform. The renderer is Skia on the CPU (renderer-skia-software): it needs no GPU,
# driver or OpenGL library, draws the same pixels on every machine, shapes Arabic, Devanagari and the other scripts, and
# supports the rotations and scaling that Slint's own software renderer lacks (measured: finestra-unica-prove/foto/testo).
# AccessKit for screen readers.
slint = { version = "1.19.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-skia-software",
    "accessibility",
    # the window's handle, so the file chooser opens over it and the system keeps it in front (rfd)
    "raw-window-handle-06",
    # the typeface of the language in use is registered as the fallback of its script (lingua.rs); the API may change in a minor
    # release of Slint, which breaks the build and does not go unseen
    "unstable-fontique-012",
] }
# The system's own dialog for choosing a file: the XDG desktop portal on Linux (it loads libdbus at run time and falls back to
# zenity), the standard dialogs on Windows and macOS. One API for the three; evidence in design/lavoro/4-app/costruzione/.
rfd = { version = "0.18.0", default-features = false, features = ["xdg-portal", "wayland"] }

[features]
# The pseudo-languages `en-XA` and `ar-XB` (tests only): `cargo build --features pseudo`, then KALLIOPE_LINGUA=en-XA
pseudo = ["kalliope-i18n/pseudo"]

[dev-dependencies]
# a window with no screen, to test what the generated Slint code computes (the mirror, the distance between lines)
i-slint-backend-testing = "1.19.1"

[build-dependencies]
kalliope-tokens.workspace = true
kalliope-i18n.workspace = true
slint-build = "1.19.1"
