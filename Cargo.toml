[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.100"
license = "LicenseRef-SANSEVIERIA-1.1"
publish = false

[workspace.dependencies]
kalliope-text = { path = "crates/text" }
kalliope-phonemes = { path = "crates/phonemes" }
kalliope-voice = { path = "crates/voice" }
kalliope-mic = { path = "crates/mic" }
kalliope-tokens = { path = "crates/tokens" }
kalliope-sample = { path = "crates/sample" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
