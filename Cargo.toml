[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "LicenseRef-SANSEVIERIA-1.0"
publish = false

[workspace.dependencies]
kalliope-text = { path = "crates/text" }
kalliope-phonemes = { path = "crates/phonemes" }
kalliope-voice = { path = "crates/voice" }
kalliope-mic = { path = "crates/mic" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
