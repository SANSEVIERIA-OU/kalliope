<?xml-stylesheet href="../token.css" type="text/css"?>
<!-- Direzione 3 · il disegno per le grandezze piccole (16 e 24 px): la bolla sulla griglia dei pixel di 16 (un pixel = 8 unità),
     bordo di un pixel, le due righe della frase come due tratti: la prima detta, la seconda no. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="d3-bordo-p" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--d3-bordo-alto)"/>
      <stop offset="1" style="stop-color:var(--d3-bordo-basso)"/>
    </linearGradient>
  </defs>
  <path d="M32 16h64a24 24 0 0 1 24 24v32a24 24 0 0 1-24 24H56l-20 18a3 3 0 0 1-5-2.2V96A24 24 0 0 1 8 72V40a24 24 0 0 1 24-24z" fill="url(#d3-bordo-p)"/>
  <rect x="16" y="24" width="96" height="64" rx="16" style="fill:var(--d3-bolla)"/>
  <rect x="32" y="40" width="64" height="16" rx="8" style="fill:var(--d3-parola-detta)"/>
  <rect x="32" y="64" width="40" height="16" rx="8" style="fill:var(--d3-parola-attesa)"/>
</svg>
