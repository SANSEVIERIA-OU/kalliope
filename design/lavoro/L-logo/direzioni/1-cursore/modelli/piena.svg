<!-- Direzione 1 · la forma piena: un quadrato pieno senza angoli, come lo vuole macOS (il sistema mette la maschera).
     Il segno chiaro della barra, ridotto a 0,8 attorno al centro, su una piastrella magenta che si vede anche sullo scuro. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <rect width="128" height="128" style="fill:var(--d1-piastra)"/>
  <g fill="none" stroke-width="12.8" stroke-linecap="round">
    <rect x="22.4" y="68.8" width="20.8" height="12.8" rx="6.4" style="fill:var(--d1-cursore-acceso)" stroke="none"/>
    <rect x="49.6" y="27.2" width="12.8" height="73.6" rx="6.4" style="fill:var(--d1-cursore-acceso)" stroke="none"/>
    <path d="M71.56 47.89A22.4 22.4 0 0 1 71.56 80.11" style="stroke:var(--d1-onda-vicina-accesa)"/>
    <path d="M87.07 41.43A38.4 38.4 0 0 1 87.07 86.57" style="stroke:var(--d1-onda-lontana-accesa)"/>
  </g>
</svg>
