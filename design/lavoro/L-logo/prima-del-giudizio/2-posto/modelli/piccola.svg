<?xml-stylesheet href="../token.css" type="text/css"?>
<!-- Direzione 2 · il disegno per le grandezze piccole (16 e 24 px): senza spessore, le quattro fasce sulla griglia dei pixel di 16
     (un pixel = 8 unità), due pixel ciascuna; il tuo posto ne ha quattro. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <rect x="8" y="8" width="112" height="112" rx="32" style="fill:var(--d2-fascia-lontana)"/>
  <rect x="24" y="24" width="80" height="80" rx="22" style="fill:var(--d2-fascia-media)"/>
  <rect x="40" y="40" width="48" height="48" rx="13" style="fill:var(--d2-fascia-vicina)"/>
  <rect x="48" y="48" width="32" height="32" rx="8" style="fill:var(--d2-nucleo)"/>
</svg>
